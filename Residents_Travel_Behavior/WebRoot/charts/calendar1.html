<!DOCTYPE html>
<html>
<head>
    <title>ECharts</title>
    <!-- 引入 echarts.js -->
    <script src="echarts.min.js"></script>
</head>
<body>
    <!-- 为ECharts准备一个具备大小（宽高）的Dom -->
    <div id="main" style="width: 1000px;height:600px;"></div>
    <script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById('main'));

        // 指定图表的配置项和数据
        function renderItem(params, api) {
    var values = [api.value(0), api.value(1)];
    var coord = api.coord(values);
    var size = api.size([1, 1], values);
    return {
        type: 'sector',
        shape: {
            cx: params.coordSys.cx,
            cy: params.coordSys.cy,
            r0: coord[2] - size[0] / 2,
            r: coord[2] + size[0] / 2,
            startAngle: coord[3] - size[1] / 2,
            endAngle: coord[3] + size[1] / 2
        },
        style: api.style({
            fill: api.visual('color')
        })
    };
}

var hours =['0时','1时','2时','3时','4时','5时','6时','7时','8时','9时','10时','11时','12时','13时','14时','15时','16时','17时','18时','19时','20时','21时','22时','23时'];
var days = ['2月26日', '2月27日', '2月28日'];

var data = [
[0,0,10],[0,1,10],[0,2,7],[0,3,7],
[0,4,3],[0,5,3],[0,6,1],[0,7,1],
[0,8,1],[0,9,1],[0,10,2],[0,11,3],
[0,12,5],[0,13,3],[0,14,4],[0,15,5],
[0,16,7],[0,17,7],[0,18,9],[0,19,10],
[0,20,9],[0,21,10],[0,22,7],[0,23,9],

[1,0,8],[1,1,7],[1,2,10],[1,3,7],
[1,4,7],[1,5,4],[1,6,3],[1,7,1],
[1,8,1],[1,9,1],[1,10,2],[1,11,2],
[1,12,3],[1,13,3],[1,14,4],[1,15,4],
[1,16,5],[1,17,6],[1,18,8],[1,19,8],
[1,20,7],[1,21,7],[1,22,10],[1,23,7],

[2,0,8],[2,1,8],[2,2,8],[2,3,7],
[2,4,6],[2,5,4],[2,6,2],[2,7,1],
[2,8,1],[2,9,2],[2,10,2],[2,11,1],
[2,12,3],[2,13,3],[2,14,4],[2,15,6],
[2,16,6],[2,17,7],[2,18,8],[2,19,8],
[2,20,9],[2,21,7],[2,22,9],[2,23,7]



];
var maxValue = echarts.util.reduce(data, function (max, item) {
    return Math.max(max, item[2]);
}, -Infinity);

option = {
backgroundColor: 'rgba(255, 255, 255, 1)',
    polar: {},
    tooltip: {
    },
    visualMap: {
        type: 'continuous',
        min: 0,
        max: maxValue,
        top: 'middle',
        dimension: 2,
        calculable: true
    },
    angleAxis: {
        type: 'category',
        data: hours,
        boundaryGap: false,
        splitLine: {
            show: true,
            lineStyle: {
                color: '#ddd',
                type: 'dashed'
            }
        },
        axisLine: {
            show: false
        }
    },
    radiusAxis: {
        type: 'category',
        data: days,
        z: 100,
		nameTextStyle: {
			fontWeight: 'bold',
			fontFamily: 'sans-serif',
			fontSize: 15,
			}
    },
    series: [{
        name: 'poi点用户数',
        type: 'custom',
        coordinateSystem: 'polar',
        itemStyle: {
            normal: {
                color: '#d14a61'
            }
        },
        renderItem: renderItem,
        data: data
    }]
};
        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>
</html>
