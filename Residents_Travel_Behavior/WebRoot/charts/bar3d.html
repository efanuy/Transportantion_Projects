<!DOCTYPE html>
<html>
<head>
    <title>ECharts</title>
    <!-- 引入 echarts.js -->
    <script src="echarts.min.js"></script>
	<script src="echarts-gl.min.js"></script>
</head>
<body>
    <!-- 为ECharts准备一个具备大小（宽高）的Dom -->
    <div id="main" style="width: 1000px;height:600px;"></div>
    <script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById('main'));

        // 指定图表的配置项和数据
var hours = ['0时','1时','2时','3时','4时','5时','6时','7时','8时','9时','10时','11时','12时','13时','14时','15时','16时','17时','18时','19时','20时','21时','22时','23时'];
var days = ['2月26日', '2月27日', '2月28日'];

var data = [
[0,0,5],[0,1,3],[0,2,2],[0,3,1],
[0,4,1],[0,5,1],[0,6,1],[0,7,3],
[0,20,7],[0,21,5],[0,22,4],[0,23,3],

[1,0,3],[1,1,2],[1,2,2],[1,3,1],
[1,4,1],[1,5,1],[1,6,3],[1,7,4],
[1,20,5],[1,21,4],[1,22,4],[1,23,3],

[2,0,3],[2,1,1],[2,2,2],[2,3,2],
[2,4,1],[2,5,1],[2,6,2],[2,7,4],
[2,20,6],[2,21,6],[2,22,4],[2,23,3]
];
option = {
	backgroundColor: 'rgba(255, 255, 255, 1)',
    tooltip: {},
    visualMap: {
        max: 10,
        inRange: {
            color: ['#23A00D', '#20920C', '#24A50D', '#28B80F', '#2CCB10', '#ffffbf', '#fee090', '#fdae61', '#f46d43', '#d73027', '#a50026']
        }
    },
    xAxis3D: {
        type: 'category',
        data: hours
    },
    yAxis3D: {
        type: 'category',
        data: days
    },
    zAxis3D: {
        type: 'value'
    },
    grid3D: {
        boxWidth: 200,
        boxDepth: 80,
        light: {
            main: {
                intensity: 1.2
            },
            ambient: {
                intensity: 0.3
            }
        }
    },
    series: [{
        type: 'bar3D',
        data: data.map(function (item) {
            return {
                value: [item[1], item[0], item[2]]
            }
        }),
        shading: 'color',

        label: {
            show: false,
            textStyle: {
                fontSize: 16,
                borderWidth: 1
            }
        },
        
        itemStyle: {
            opacity: 0.4
        },

        emphasis: {
            label: {
                textStyle: {
                    fontSize: 20,
                    color: '#900'
                }
            },
            itemStyle: {
                color: '#900'
            }
        }
    }]
}
        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>
</html>
