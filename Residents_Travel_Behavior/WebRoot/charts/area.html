<!DOCTYPE html>
<html>
<head>
    <title>ECharts</title>
    <!-- 引入 echarts.js -->
    <script src="echarts.min.js"></script>
</head>
<body>
    <!-- 为ECharts准备一个具备大小（宽高）的Dom -->
    <div id="main" style="width: 945px;height:600px;"></div>
    <script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById('main'));

        // 指定图表的配置项和数据
        option = {
		backgroundColor: 'rgba(255, 255, 255, 1)',
		title: {
					text: '白云区',
				},
    tooltip : {
        trigger: 'axis',
        axisPointer: {
            type: 'cross',
            label: {
                backgroundColor: '#6a7985'
            }
        }
    },
    legend: {
        data:['2月26日','2月27日','2月28日']
    },
    grid: {
        left: '3%',
        right: '4%',
        bottom: '3%',
        containLabel: true
    },
    xAxis : [
        {
            type : 'category',
            boundaryGap : false,
            data : ['0时','1时','2时','3时','4时','5时','6时','7时','8时','9时','10时','11时','12时','13时','14时','15时','16时','17时','18时','19时','20时','21时','22时','23时']
        }
    ],
    yAxis : [
        {
            type : 'value'
        }
    ],
    series : [
        {
            name:'2月26日',
            type:'line',
            stack: '总量',
            areaStyle: {normal: {}},
            data:[21122,12928,9120,6878,6996,7106,8398,16797,24924,32468,37924,46423,48884,48243,44787,45059,46365,47980,43503,37509,31739,26273,18248,15003]
        },
        {
            name:'2月27日',
            type:'line',
            stack: '总量',
            areaStyle: {normal: {}},
            data:[19464,11003,7669,6062,6195,6009,9636,23758,31022,37224,41339,41139,42415,42810,44082,38807,42590,37905,39295,33532,29742,24311,18415,14003]
        },
        {
            name:'2月28日',
            type:'line',
            stack: '总量',
            areaStyle: {normal: {}},
            data:[17083,9082,6894,5596,5822,5699,8146,21496,29507,36327,37718,40128,42885,39681,41471,37393,42409,44024,42552,34513,31874,25962,20742,13562]
        }
        
    ]
};

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>
</html>
