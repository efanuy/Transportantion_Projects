<!DOCTYPE html>
<html>
<head>
    <title>ECharts</title>
    <!-- 引入 echarts.js -->
    <script src="echarts.min.js"></script>
</head>
<body>
    <!-- 为ECharts准备一个具备大小（宽高）的Dom -->
    <div id="main" style="width: 1050px;height:600px;"></div>
    <script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById('main'));

        // 指定图表的配置项和数据

var hours = ['0时','1时','2时','3时','4时','5时','6时','7时','8时','9时','10时','11时','12时','13时','14时','15时','16时','17时','18时','19时','20时','21时','22时','23时',];
var days = ['2月26日', '2月27日', '2月28日'];

var data = [
[0,0,5],[0,1,3],[0,2,2],[0,3,1],
[0,4,1],[0,5,1],[0,6,1],[0,7,3],
[0,8,3],[0,9,7],[0,10,7],[0,11,10],
[0,12,10],[0,13,9],[0,14,7],[0,15,10],
[0,16,9],[0,17,10],[0,18,9],[0,19,7],
[0,20,7],[0,21,5],[0,22,4],[0,23,3],

[1,0,3],[1,1,2],[1,2,2],[1,3,1],
[1,4,1],[1,5,1],[1,6,3],[1,7,4],
[1,8,7],[1,9,7],[1,10,10],[1,11,7],
[1,12,8],[1,13,7],[1,14,10],[1,15,7],
[1,16,7],[1,17,8],[1,18,8],[1,19,6],
[1,20,5],[1,21,4],[1,22,4],[1,23,3],

[2,0,3],[2,1,1],[2,2,2],[2,3,2],
[2,4,1],[2,5,1],[2,6,2],[2,7,4],
[2,8,6],[2,9,7],[2,10,8],[2,11,8],
[2,12,8],[2,13,7],[2,14,9],[2,15,7],
[2,16,9],[2,17,8],[2,18,8],[2,19,7],
[2,20,6],[2,21,6],[2,22,4],[2,23,3]
];

data = data.map(function (item) {
    return [item[1], item[0], item[2] || '-'];
});

option = {
backgroundColor: 'rgba(255, 255, 255, 1)',
    tooltip: {
        position: 'top'
    },
    animation: false,
    grid: {
        height: '50%',
        y: '10%'
    },
    xAxis: {
        type: 'category',
        data: hours,
        splitArea: {
            show: true
        }
    },
    yAxis: {
        type: 'category',
        data: days,
        splitArea: {
            show: true
        }
    },
    visualMap: {
        min: 0,
        max: 10,
        calculable: true,
        orient: 'horizontal',
        left: 'center',
        bottom: '15%'
    },
    series: [{
        name: 'poi用户数',
        type: 'heatmap',
        data: data,
        itemStyle: {
            emphasis: {
                shadowBlur: 10,
                shadowColor: 'rgba(0, 0, 0, 0.5)'
            }
        }
    }]
};
        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>
</html>
